<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rabbit vs carrot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>rabbit <span class="vs">vs</span> carrot</h1>
    <p id="status" class="status">Rabbit 🐰 to move</p>

    <div id="lobby" class="lobby">
      <input id="name" class="field" type="text" placeholder="Your name" maxlength="20">
      <button id="create" class="btn" type="button">Create room</button>
      <div class="join-row">
        <input id="code" class="field" type="text" placeholder="Room code" maxlength="8">
        <button id="join" class="btn" type="button">Join</button>
      </div>
    </div>
    <p id="room-info" class="room-info"></p>

    <div id="board" class="board" role="grid" aria-label="Tic-tac-toe board"></div>
    <button id="reset" class="reset" type="button">Reset</button>

    <div id="chat" class="chat hidden">
      <div id="chat-log" class="chat-log"></div>
      <div class="chat-input-row">
        <input id="chat-input" class="field" type="text" placeholder="Message" maxlength="200">
        <button id="chat-send" class="btn" type="button">Send</button>
      </div>
    </div>
  </main>
  <script src="src/game.js"></script>
  <script src="src/net.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/online.js"></script>
</body>
</html>
