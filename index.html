<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rabbit vs carrot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>rabbit <span class="vs">vs</span> carrot</h1>
    <p id="status" class="status">Rabbit 🐰 to move</p>
    <div id="board" class="board" role="grid" aria-label="Tic-tac-toe board"></div>
    <button id="reset" class="reset" type="button">Reset</button>
    <section class="leaderboard" aria-labelledby="lb-title">
      <h2 id="lb-title">Leaderboard</h2>
      <ol id="leaderboard"></ol>
      <p id="draws" class="draws"></p>
      <button id="clear-scores" class="clear" type="button">Clear scores</button>
    </section>
  </main>
  <script src="src/game.js"></script>
  <script src="src/leaderboard.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
